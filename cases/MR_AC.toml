relation = "MR_AC"

# ── C = category ──────────────────────────────────────────────────────────────────────────────────

[[case]]
id = "MR_AC-001"
source = "show electronics items"
followup = "show electronics items under $100"
refine = {control = "maxPrice", value = 100}

[case.writes]
"show electronics items" = ["category"]
"show electronics items under $100" = ["category", "maxPrice"]

[[case]]
id = "MR_AC-002"
source = "show electronics items"
