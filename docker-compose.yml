services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:docker
    ports:
      - "5173:5173"
      - "3001:3001"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
