# Every sentence the cases use comes from here: one value per control, and the app's templates (app/control-surface.yaml),
# each filled with that value. The make.py of each relation then combines these sentences by one fixed rule.
#
# The value set: one value per control, kept only if every pair of these filters still narrows the products shown and
# leaves some (values.py checks it against the catalog). So any constraint δ added in MR_AC removes products, but
# never all of them. Seven sets pass; this is one of them. A second set would repeat every rule on other values.
#
# Per control:
#   value      the value it is set to (shop.toml)
#   phrases    how a sentence names that value; the first is used everywhere, the others only in MR_CE
#   templates  the app's sentences for this control; {v} is the phrase
#   delta      the constraint δ: added to the end of another sentence (MR_AC), or said as a turn on its own (MR_COMP).
#              Only the constraining controls have one
#   undo       a sentence that sets the control back to its start value (MR_REV)
#
# Clear Filters is left out: said from σ0 it changes nothing, and it cannot be undone.

# Figure 1.2's sentence: three controls at once, filled with the same values.
figure = "show {category} under {maxPrice} sorted by {sort}"

[category]
value = "electronics"
phrases = ["electronics"]
templates = ["show {v} items", "filter to {v} only"]
delta = "in {v}"
undo = "show all categories"

[maxPrice]
value = 100
phrases = ["$100"]
templates = ["show items under {v}", "show items cheaper than {v}"]
delta = "under {v}"
undo = "remove the price limit"

[minRating]
value = 4
phrases = ["4 stars"]
templates = ["show items rated {v} and up"]
delta = "rated {v} and up"
undo = "remove the rating filter"

[inStockOnly]
value = true
phrases = [""]                      # its template names no value
templates = ["hide out-of-stock items"]
delta = "that are in stock"
undo = "show out-of-stock items again"

[sort]
value = "rating_desc"
phrases = ["rating", "best rated first"]
templates = ["sort by {v}", "order the results by {v}"]
undo = "use the default order"
