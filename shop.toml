# The model of the shop: the filters and sort the "ask" bar can set, their values, and each one's start
# value, as in app/control-surface.yaml. The cases use these names in [case.writes]. Each control is one test
# requirement: every relation must have cases that change every control it admits (run.py --check counts them).
#
# A control is a choice (values = [...]) or a number (min, max). No `start`: it starts unset (⊥), e.g. no category.
# constraining: it narrows the products shown. MR_AC's added constraint may only set one of these.
# reversible:   a sentence can set it back. MR_REV may only use these.

[control.category]
values = ["electronics", "books", "clothing", "home", "sports"]
constraining = true # C_con
reversible = true #C_rev

[control.maxPrice]
min = 0
max = 500
start = 500
constraining = true
reversible = true

[control.minRating]
values = [3, 3.5, 4, 4.5]
constraining = true
reversible = true

[control.inStockOnly]
values = [true, false]
start = false
constraining = true
reversible = true

[control.sort]
values = ["price_asc", "price_desc", "rating_desc", "name_asc"]
constraining = false  
reversible = true
